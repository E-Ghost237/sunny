<section class="auth">
  <div class="auth__media" aria-hidden="true"><img class="kb" src="/assets/img/hero-about.jpg" alt="" /></div>
  <div class="auth__veil" aria-hidden="true"></div>
  <div class="auth__card" appReveal>
    <app-logo />
    <h1>Join DeLight</h1>
    <p class="sub">Earn points on every order and keep your details on file.</p>
    <form (submit)="$event.preventDefault(); submit()">
      <div class="row">
        <div class="field"><label for="fn">First name</label><input id="fn" name="fn" [(ngModel)]="firstName" autocomplete="given-name" /></div>
        <div class="field"><label for="ln">Last name</label><input id="ln" name="ln" [(ngModel)]="lastName" autocomplete="family-name" /></div>
      </div>
      <div class="field"><label for="em">Email</label><input id="em" type="email" name="em" [(ngModel)]="email" autocomplete="email" /></div>
      <div class="field"><label for="ph">Phone (optional)</label><input id="ph" type="tel" name="ph" [(ngModel)]="phone" autocomplete="tel" /></div>
      <button type="submit" class="btn btn--primary btn--block" [disabled]="!email || !firstName || !lastName">Create account</button>
    </form>
    <p class="fine">Already a member? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
