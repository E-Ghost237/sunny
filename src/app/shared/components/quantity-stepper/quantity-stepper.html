<div class="qty" role="group" aria-label="Quantity">
  <button type="button" (click)="decrement()" [disabled]="quantity() <= 1" aria-label="Decrease quantity">−</button>
  <span class="qty__value" aria-live="polite">{{ quantity() }}</span>
  <button type="button" (click)="increment()" aria-label="Increase quantity">+</button>
</div>
