<button type="button" class="acc__head" [class.is-detail]="variant() === 'detail'" [attr.aria-expanded]="open()" (click)="toggle()">
  <span>{{ title() }}</span>
  <span class="acc__icon" aria-hidden="true"></span>
</button>
<div class="acc__panel" [class.is-open]="open()">
  <div class="acc__inner">
    <div class="acc__content">
      <ng-content />
    </div>
  </div>
</div>
