<div class="rs">
  <div class="rs__values">
    <span>{{ label(currentMin()) }}</span>
    <span class="rs__sep" aria-hidden="true">—</span>
    <span>{{ label(currentMax()) }}</span>
  </div>
  <div class="rs__track">
    <div class="rs__fill" [style.left.%]="fillLeft()" [style.right.%]="fillRight()"></div>
    <input type="range" class="rs__input" aria-label="Minimum" [min]="boundMin()" [max]="boundMax()"
      [value]="currentMin()" (input)="onMinInput($any($event.target).value)" />
    <input type="range" class="rs__input" aria-label="Maximum" [min]="boundMin()" [max]="boundMax()"
      [value]="currentMax()" (input)="onMaxInput($any($event.target).value)" />
  </div>
  @if (note()) {
    <p class="rs__note">{{ note() }}</p>
  }
</div>
